name: 동천한식뷔페 메뉴 -> Teams 전송

on:
  schedule:
    # UTC 기준 (KST = UTC+9). 평일(월~금)에만 실행 - cron 요일 필드 1-5.
    # 01:45/08:20 UTC는 같은 날짜의 KST 오전/오후라 날짜가 바뀌지 않으므로
    # 요일 필드를 그대로 평일 기준으로 써도 안전함.
    #
    # 새 글이 없으면 scraper.py가 같은 실행 안에서 1분 대기 후 한 번 더
    # 확인한다 (GitHub Actions 스케줄은 부하 시 지연될 수 있어서, 별도
    # cron으로 "재확인"을 나누면 순서가 뒤바뀔 위험이 있음 - 그래서 재확인은
    # cron이 아니라 스크립트 내부에서 처리).
    - cron: "45 1 * * 1-5"  # 10:45 KST - 중식 체크 (관찰된 게시 10:29~10:38)
    - cron: "20 8 * * 1-5"  # 17:20 KST - 석식 체크 (관찰된 게시 17:04~17:12)

  # 수동 실행: Actions 탭 -> Run workflow 버튼
  # force=true 로 실행하면 dedupe 무시하고 최신 글을 즉시 강제 재전송
  workflow_dispatch:
    inputs:
      force:
        description: "최신 게시글을 dedupe 무시하고 즉시 재전송할지 여부"
        type: boolean
        default: false

  # 외부(API 호출)에서 즉시 트리거하고 싶을 때 사용.
  repository_dispatch:
    types: [menu-check]

permissions:
  contents: write  # GITHUB_TOKEN으로 state.json을 Contents API로 갱신하려면 필요

# 스케줄/수동/API 트리거가 겹쳐도 동시에 두 잡이 state.json을 건드리지
# 않도록 직렬화. 이미 실행 중이면 새 트리거는 대기열에 쌓인다(취소하지 않음).
concurrency:
  group: menu-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 스크래핑 + Teams 전송
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          KAKAO_CHANNEL_ID: ${{ vars.KAKAO_CHANNEL_ID }}
          FORCE_RESEND: ${{ (github.event.inputs.force == 'true') && '1' || '0' }}
          # state.json은 git commit/push가 아니라 스크립트 안에서 GitHub Contents
          # API로 직접(sha 기반 compare-and-swap) 갱신한다. 별도 커밋 스텝이
          # 필요 없고, 실패하면 스크립트가 그 자리에서 Teams에 알린다.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py
